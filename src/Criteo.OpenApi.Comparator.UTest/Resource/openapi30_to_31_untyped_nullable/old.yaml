openapi: 3.0.4
info:
  version: 1.0.0
  title: Delta
paths:
  /messages:
    get:
      operationId: listMessages
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
components:
  schemas:
    Message:
      type: object
      properties:
        handlingResult:
          nullable: true
        payload:
          nullable: true
