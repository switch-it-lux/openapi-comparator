openapi: 3.0.3
info:
  version: 1.0.0
  title: Delta
paths:
  /pets:
    get:
      operationId: listPets
      responses:
        "200":
          description: pet response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
            application/xml:
              schema:
                $ref: '#/components/schemas/Pet'
components:
  schemas:
    Pet:
      type: object
      properties:
        internal:
          type: integer
          x-exclude: true
        visible:
          type: integer
          x-exclude: false
    Hidden:
      type: object
      x-exclude: true
      properties:
        secret:
          type: integer
